<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本の山 — 衛星マップ</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body { margin: 0; height: 100%; }
    #map { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map").setView([36, 138], 5);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution:
          "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
        maxZoom: 19,
      }
    ).addTo(map);

    const markerStyle = {
      radius: 6,
      fillColor: "#FFD700",
      color: "#B8860B",
      weight: 1,
      opacity: 1,
      fillOpacity: 0.9,
    };

    function formatElevation(elevation) {
      if (elevation === null || elevation === undefined || elevation === "") {
        return "—";
      }
      return `${Number(elevation).toLocaleString("ja-JP")} m`;
    }

    function popupHtml(mountain) {
      const name = mountain.name ?? "（名称不明）";
      const elevation = formatElevation(mountain.elevation);
      return `<strong>${escapeHtml(name)}</strong><br>標高: ${escapeHtml(elevation)}`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text);
      return div.innerHTML;
    }

    fetch("/api/mountains")
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then((mountains) => {
        mountains.forEach((m) => {
          const lat = Number(m.latitude);
          const lng = Number(m.longitude);
          if (Number.isNaN(lat) || Number.isNaN(lng)) return;

          L.circleMarker([lat, lng], markerStyle)
            .addTo(map)
            .bindPopup(popupHtml(m));
        });
      })
      .catch((err) => {
        console.error("山データの取得に失敗しました:", err);
      });
  </script>
</body>
</html>
