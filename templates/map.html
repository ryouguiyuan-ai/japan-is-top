<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>日本の山 — 衛星マップ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400&display=swap"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    html, body {
      margin: 0;
      height: 100%;
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-weight: 400;
    }
    #map { width: 100%; height: 100%; }

    .mood-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      z-index: 1000;
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .mood-input,
    .mood-btn {
      font-family: inherit;
      font-weight: 400;
      font-size: 14px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 2px 14px rgba(0, 0, 0, 0.08);
      color: #333;
    }

    .mood-input {
      width: 240px;
      padding: 10px 14px;
      outline: none;
    }

    .mood-input::placeholder {
      color: #999;
    }

    .mood-input:focus {
      box-shadow: 0 2px 16px rgba(0, 0, 0, 0.12);
    }

    .mood-btn {
      padding: 10px 18px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .mood-btn:hover {
      background: rgba(255, 255, 255, 0.96);
    }

    .mood-btn:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .recommend-backdrop {
      position: fixed;
      inset: 0;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.12);
    }

    .recommend-backdrop[hidden] {
      display: none;
    }

    .recommend-popup {
      position: relative;
      max-width: min(420px, 90vw);
      padding: 28px 36px 24px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.92);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
    }

    .recommend-close {
      position: absolute;
      top: 10px;
      right: 12px;
      border: none;
      background: transparent;
      font-size: 20px;
      line-height: 1;
      color: #888;
      cursor: pointer;
      padding: 4px 8px;
      font-family: inherit;
    }

    .recommend-close:hover {
      color: #444;
    }

    .recommend-text {
      margin: 0;
      font-size: 15px;
      line-height: 1.7;
      color: #333;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <div class="mood-panel">
    <input
      type="text"
      class="mood-input"
      id="moodInput"
      placeholder="今日の気分は？"
      autocomplete="off"
    />
    <button type="button" class="mood-btn" id="moodBtn">聞く</button>
  </div>

  <div class="recommend-backdrop" id="recommendBackdrop" hidden>
    <div class="recommend-popup" role="dialog" aria-modal="true" aria-labelledby="recommendText">
      <button type="button" class="recommend-close" id="recommendClose" aria-label="閉じる">×</button>
      <p class="recommend-text" id="recommendText"></p>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script>
    const map = L.map("map").setView([36, 138], 5);

    L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        attribution:
          "Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community",
        maxZoom: 19,
      }
    ).addTo(map);

    const markerStyle = {
      radius: 6,
      fillColor: "#FFD700",
      color: "#B8860B",
      weight: 1,
      opacity: 1,
      fillOpacity: 0.9,
    };

    function formatElevation(elevation) {
      if (elevation === null || elevation === undefined || elevation === "") {
        return "—";
      }
      return `${Number(elevation).toLocaleString("ja-JP")} m`;
    }

    function popupHtml(mountain) {
      const name = mountain.name ?? "（名称不明）";
      const elevation = formatElevation(mountain.elevation);
      return `<strong>${escapeHtml(name)}</strong><br>標高: ${escapeHtml(elevation)}`;
    }

    function escapeHtml(text) {
      const div = document.createElement("div");
      div.textContent = String(text);
      return div.innerHTML;
    }

    fetch("/api/mountains")
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.json();
      })
      .then((mountains) => {
        mountains.forEach((m) => {
          const lat = Number(m.latitude);
          const lng = Number(m.longitude);
          if (Number.isNaN(lat) || Number.isNaN(lng)) return;

          L.circleMarker([lat, lng], markerStyle)
            .addTo(map)
            .bindPopup(popupHtml(m));
        });
      })
      .catch((err) => {
        console.error("山データの取得に失敗しました:", err);
      });

    const moodInput = document.getElementById("moodInput");
    const moodBtn = document.getElementById("moodBtn");
    const recommendBackdrop = document.getElementById("recommendBackdrop");
    const recommendText = document.getElementById("recommendText");
    const recommendClose = document.getElementById("recommendClose");
    let enterPressCount = 0;
    let enterResetTimer = null;
    const ENTER_WINDOW_MS = 700;
    let isSubmitting = false;

    function showPopup(message) {
      recommendText.textContent = message;
      recommendBackdrop.hidden = false;
    }

    function hidePopup() {
      recommendBackdrop.hidden = true;
    }

    async function submitRecommend() {
      const mood = moodInput.value.trim();
      if (!mood || isSubmitting) return;

      isSubmitting = true;
      moodBtn.disabled = true;
      showPopup("考え中...");

      try {
        const res = await fetch("/api/recommend", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ mood }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          showPopup("エラーが発生しました");
          return;
        }
        showPopup(data.recommendation ?? "");
      } catch {
        showPopup("エラーが発生しました");
      } finally {
        isSubmitting = false;
        moodBtn.disabled = false;
      }
    }

    moodInput.addEventListener("keydown", (e) => {
      if (e.key !== "Enter") return;

      e.preventDefault();
      enterPressCount += 1;
      clearTimeout(enterResetTimer);
      enterResetTimer = setTimeout(() => {
        enterPressCount = 0;
      }, ENTER_WINDOW_MS);

      if (enterPressCount >= 2) {
        enterPressCount = 0;
        clearTimeout(enterResetTimer);
        submitRecommend();
      }
    });

    moodBtn.addEventListener("click", submitRecommend);
    recommendClose.addEventListener("click", hidePopup);
    recommendBackdrop.addEventListener("click", (e) => {
      if (e.target === recommendBackdrop) hidePopup();
    });
  </script>
</body>
</html>
